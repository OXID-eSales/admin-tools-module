install:
  cache:
    prepared_shop: false
  composer:
    root_url: ''
    transform: |
      {
          "require": {
              "oxid-esales/oxideshop-ce": "{{ .Data.install.composer.dev_ref }}",
              "oxid-esales/twig-component": "{{ .Data.install.composer.dev_ref }}",
              "oxid-esales/twig-admin-theme": "{{ .Data.install.composer.dev_ref }}",
              "oxid-esales/apex-theme": "{{ .Data.install.composer.dev_ref }}",
              "oxid-esales/developer-tools": "{{ .Data.install.composer.dev_ref }}"
          },
          "autoload-dev":{
              "psr-4": {
                "OxidEsales\\EshopCommunity\\Tests\\": "./vendor/oxid-esales/oxideshop-ce/tests"
              }
          }
      }
  custom_script_container: |
    vendor/bin/oe-console oe:database:reset --db-host=mysql --db-port=3306 --db-name=example --db-user=root --db-password=root --force
    vendor/bin/oe-console oe:module:install ./
    
    vendor/bin/oe-eshop-doctrine_migration migrations:migrate
    vendor/bin/oe-eshop-db_views_generate
    
    vendor/bin/oe-console oe:module:activate oe_admintools
    vendor/bin/oe-console oe:theme:activate apex

runscript: &runscript
  matrix:
    script: |
      [
        "admin_tools:tests-unit",
        "admin_tools:tests-integration",
        "admin_tools:tests-codeception"
      ]
  composer:
    early: true
  admin_tools:
    path: ''

runslim:
  <<: *runscript
  matrix:
    script: |
      [
        "admin_tools:phpcs",
        "admin_tools:phpstan"
      ]

sonarcloud:
  matrix:
    testplan: '["-"]'
  strip_path: '/var/www/'
  organization: 'oxid-esales'
  project_key: 'OXID-eSales_admin-tools-module'
  project_name: 'oxid-esales/admin-tools-module'
  target_branch: 'b-7.5.x'
  parameters: >
    -Dsonar.language=php
    -Dsonar.scm.provider=git
    -Dsonar.sources=src
    -Dsonar.tests=tests
    -Dsonar.php.phpstan.reportPaths=coverage-reports/phpstan.report.json

finish:
  slack_title: 'Module Admin tools ({{ .Data.install.git.shop_ref }}) by {{ .Github.Actor }}'